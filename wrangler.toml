name = "tokobuku-v2"
compatibility_date = "2024-09-23"
compatibility_flags = ["nodejs_compat"]

# Cloudflare Pages Static Build Output Directory
pages_build_output_dir = "."

# Cloudflare Workers Static Assets Configuration
[assets]
directory = "."
binding = "ASSETS"

# Cloudflare D1 Database Binding Configuration
[[d1_databases]]
binding = "DB"
database_name = "gudangbuku-db"
database_id = "gudangbuku-db"
